<style>

  --body:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1920; --panel:#15262E; --ink:#E9F2F5; --muted:#9BB0BA; --line:#2B414C;
    --primary:#5CC184; --on-primary:#0B1A12; --alert:#FF7C65;
    --fur:#E8A850; --ear:#B8702F; --bone:#F0D79E; --shadow:rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1920; --panel:#15262E; --ink:#E9F2F5; --muted:#9BB0BA; --line:#2B414C;
  --primary:#5CC184; --on-primary:#0B1A12; --alert:#FF7C65;
  --fur:#E8A850; --ear:#B8702F; --bone:#F0D79E; --shadow:rgba(0,0,0,.4);
  color-scheme:dark;
}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
#root{min-height:100%}
:focus-visible{outline:3px solid var(--primary);outline-offset:3px}

.app{min-height:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding-inline:16px;padding-block:20px}
.top{width:100%;max-width:960px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;margin:0;font-family:var(--display);font-weight:400;font-size:1.5rem}
.brand svg{width:40px;height:16px;color:var(--bone)}
.ghost{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:transparent;color:var(--ink);font:inherit;cursor:pointer}
.ghost svg{width:20px;height:20px}

.card{width:100%;max-width:960px;display:grid;grid-template-columns:minmax(0,1fr);gap:20px;align-items:center}
@media (min-width:820px){.card{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:36px}}

/* stage */
.stage{position:relative;width:min(100%,440px);aspect-ratio:1;margin-inline:auto}
.ring{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.dogbox{position:absolute;inset:15% 13% 8% 13%}
.dog{width:100%;height:100%;overflow:visible;display:block}
.bubble{position:absolute;top:1%;right:1%;padding:2px 16px 4px;border-radius:20px;border:2.5px solid var(--ink);background:var(--panel);font-family:var(--display);font-size:1.6rem;line-height:1.3;transform-origin:15% 100%;animation:pop .9s ease-in-out infinite}
.bubble::after{content:"";position:absolute;left:16px;bottom:-9px;width:14px;height:14px;background:var(--panel);border-right:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);transform:rotate(45deg)}
.confetti{position:absolute;inset:-4%;overflow:hidden;pointer-events:none;border-radius:28px}
.bit{position:absolute;top:-10%;width:28px;color:var(--bone);animation:fall 2.6s linear 4 both,spin 1.3s linear infinite}
.bit svg{display:block;width:100%;height:auto}
.bit-1{color:var(--fur)}
.bit-2{color:var(--tongue)}

/* dog animation hooks */
.dog .dog-all{transform-origin:120px 246px}
.dog .head{transform-origin:120px 168px}
.dog .tail{transform-origin:170px 208px}
.dog .ear{transform-box:fill-box;transform-origin:50% 6%}
.dog .eye{transform-box:fill-box;transform-origin:50% 50%;animation:blink 4.2s infinite}
.dog .pant{transform-box:fill-box;transform-origin:50% 0%}

.mood-idle .tail{animation:wag 1.4s ease-in-out infinite alternate}
.mood-idle .head{animation:tilt 3.2s ease-in-out infinite alternate}
.mood-idle .ear-l{animation:earL 2.4s ease-in-out infinite alternate}
.mood-idle .ear-r{animation:earR 2.4s ease-in-out infinite alternate}

.mood-focus .tail{animation:wag .9s ease-in-out infinite alternate}
.mood-focus .head{animation:nod 2s ease-in-out infinite}
.mood-focus .ear-l{animation:earL 1.6s ease-in-out infinite alternate}
.mood-focus .ear-r{animation:earR 1.6s ease-in-out infinite alternate}
.mood-focus .pant{animation:pant .55s ease-in-out infinite alternate}

.mood-excited .dog-all{animation:hop .5s ease-in-out infinite}
.mood-excited .tail{animation:wag .22s ease-in-out infinite alternate}
.mood-excited .head{animation:tilt .4s ease-in-out infinite alternate}
.mood-excited .ear-l{animation:flapL .3s ease-in-out infinite alternate}
.mood-excited .ear-r{animation:flapR .3s ease-in-out infinite alternate}
.mood-excited .pant{animation:pant .2s ease-in-out infinite alternate}

.mood-done .dog-all{animation:jump .8s ease-in-out infinite}
.mood-done .tail{animation:wag .18s ease-in-out infinite alternate}
.mood-done .head{animation:tilt .35s ease-in-out infinite alternate}
.mood-done .ear-l{animation:flapL .3s ease-in-out infinite alternate}
.mood-done .ear-r{animation:flapR .3s ease-in-out infinite alternate}
.mood-done .pant{animation:pant .25s ease-in-out infinite alternate}

.mood-sleep .tail{transform:rotate(14deg)}
.mood-sleep .head{transform:rotate(7deg) translateY(4px)}
.zz{font-family:var(--display);fill:var(--muted);animation:floatZ 2.4s ease-in infinite}

@keyframes wag{from{transform:rotate(-14deg)}to{transform:rotate(16deg)}}

@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}

@keyframes blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}}
@keyframes earL{from{transform:rotate(3deg)}to{transform:rotate(-6deg)}}
@keyframes earR{from{transform:rotate(-3deg)}to{transform:rotate(6deg)}}
@keyframes flapL{from{transform:rotate(8deg)}to{transform:rotate(-14deg)}}
@keyframes flapR{from{transform:rotate(-8deg)}to{transform:rotate(14deg)}}
@keyframes pant{from{transform:scaleY(.85)}to{transform:scaleY(1.2)}}
@keyframes floatZ{0%{transform:translate(0,6px);opacity:0}30%{opacity:1}100%{transform:translate(8px,-14px);opacity:0}}
@keyframes pop{0%,100%{transform:scale(1) rotate(-3deg)}50%{transform:scale(1.12) rotate(3deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}

/* panel */
.panel{display:flex;flex-direction:column;gap:18px;min-width:0;padding:24px 20px;border-radius:28px;border:1px solid var(--line);background:var(--panel)}
.say{margin:0;min-height:1.6em;font-family:var(--display);font-size:1.15rem;color:var(--muted);text-wrap:balance}
.time{display:flex;justify-content:center;margin:0;font-family:var(--display);font-size:clamp(3.6rem,18vw,6.8rem);line-height:1;color:var(--ink)}
.time span{display:inline-block;text-align:center}
.time .d{width:.62em}
.time .c{width:.34em}
.time.alert{color:var(--alert)}
.time.excited{animation:pulse 1s ease-in-out infinite}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:8px 16px;border-radius:999px;border:1.5px solid var(--line);background:transparent;color:var(--ink);font-family:var(--display);font-size:1rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.custom{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.custom .title{margin-right:4px;color:var(--muted)}
.num{width:4.6rem;min-height:44px;padding:0 6px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font-family:var(--display);font-size:1.15rem;text-align:center}
.custom label{margin-right:6px}

.actions{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 22px;border-radius:16px;border:2px solid var(--line);background:transparent;color:var(--ink);font-family:var(--display);font-size:1.2rem;cursor:pointer}
.btn svg{width:20px;height:20px}
.btn.primary{flex:1 1 160px;background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:active:not(:disabled){transform:translateY(1px)}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .confetti{display:none}
}

        setRemaining(Math.max(0, endRef.current - Date.now()));
        setStatus('paused');
        return;
      }
      ensureAudio();
      var base = (status === 'done' || remaining <= 0) ? duration * 1000 : remaining;
      setRemaining(base);
      endRef.current = Date.now() + base;
      setStatus('running');
    }
    function reset() { setRemaining(duration * 1000); setStatus('idle'); }

    var mm = Math.floor(duration / 60), ss = duration % 60;
    function onMin(ev) { applyDuration(clamp(parseInt(ev.target.value, 10) || 0, 0, 99) * 60 + ss); }
    function onSec(ev) { applyDuration(mm * 60 + clamp(parseInt(ev.target.value, 10) || 0, 0, 59)); }

    var secs = Math.ceil(remaining / 1000);
    var mood = status === 'done' ? 'done' : status === 'paused' ? 'sleep'
      : status === 'running' ? (secs <= 10 ? 'excited' : 'focus') : 'idle';
    var f = duration > 0 ? Math.min(1, remaining / (duration * 1000)) : 0;
    var hot = mood === 'excited' || mood === 'done';

    var say = {
      idle: '준비 완료! 시간을 정해 주세요.',
      focus: '꼬리 살랑살랑, 열심히 기다리는 중이에요.',
      excited: secs + '초! 곧 끝나요, 멍멍!',
      sleep: '쿨쿨… 잠깐 쉬는 중이에요.',
      done: '시간 끝! 멍멍!'
    }[mood];
    var main = { idle: '시작', running: '일시정지', paused: '이어서', done: '다시 시작' }[status];

    return e('div', { className: 'app' },
      e('header', { className: 'top' },
        e('h1', { className: 'brand' }, e(BoneIcon), '멍멍 타이머'),
        e('button', { className: 'ghost', id: 'sound-toggle', type: 'button', 'aria-pressed': !muted, onClick: function () { setMuted(!muted); } },
          e(Icon, { name: muted ? 'mute' : 'sound' }), muted ? '소리 꺼짐' : '소리 켜짐')),
      e('main', { className: 'card' },
        e('section', { className: 'stage', 'aria-label': '강아지와 남은 시간 링' },
          e(Ring, { f: f, alert: mood === 'excited' }),
          e('div', { className: 'dogbox' }, e(Dog, { mood: mood })),
          hot ? e('div', { className: 'bubble', 'aria-hidden': 'true' }, mood === 'done' ? '멍멍!' : '멍!') : null,
          mood === 'done' ? e(Confetti) : null),
        e('section', { className: 'panel' },
          e('p', { className: 'say', 'aria-live': 'polite' }, say),
          e(Time, { text: fmt(secs), cls: (hot ? 'alert ' : '') + (mood === 'excited' ? 'excited' : '') }),
          e('div', { className: 'chips', role: 'group', 'aria-label': '시간 고르기' },
            PRESETS.map(function (m) {
              return e('button', { key: m, type: 'button', className: 'chip', 'aria-pressed': duration === m * 60, onClick: function () { applyDuration(m * 60); } }, m + '분');
            })),
          e('div', { className: 'custom' },
            e('span', { className: 'title' }, '직접 입력'),
            e('input', { id: 'custom-min', className: 'num', type: 'number', inputMode: 'numeric', min: 0, max: 99, value: mm, onChange: onMin }),
            e('label', { htmlFor: 'custom-min' }, '분'),
            e('input', { id: 'custom-sec', className: 'num', type: 'number', inputMode: 'numeric', min: 0, max: 59, value: ss, onChange: onSec }),
            e('label', { htmlFor: 'custom-sec' }, '초')),
          e('div', { className: 'actions' },
            e('button', { type: 'button', id: 'primary-btn', className: 'btn primary', disabled: duration === 0, onClick: primary },
              e(Icon, { name: status === 'running' ? 'pause' : status === 'done' ? 'replay' : 'play' }), main),
            e('button', { type: 'button', id: 'reset-btn', className: 'btn', disabled: status === 'idle', onClick: reset },
              e(Icon, { name: 'replay' }), '처음으로')))));
  }

  ReactDOM.createRoot(document.getElementById('root')).render(e(App));
})();
</script>
